# Builds Snoop and runs its tests on every push and pull request.
#
#  tests      Linux. Builds Snoop.slnx (everything except the WinUI app) and runs the cross-platform
#             tests, including the check that the README's keyboard shortcut tables match the app.
#  app        Windows. Builds the WinUI desktop app and runs the keyboard tests (tests/Snoop.App.UITests),
#             which start Snoop.exe in --test mode and press every shortcut through UI Automation.
#             When one fails, the screenshots it saved are uploaded as the "ui-test-screenshots" artifact.
#
# Standard GitHub-hosted runners are free for public repositories.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Snoop.slnx -c Release

      - name: Test
        run: dotnet test Snoop.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  app:
    name: Desktop app and keyboard tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SNOOP_UITEST_SCREENSHOTS: ${{ github.workspace }}\ui-test-screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the desktop app
        run: dotnet build src/Snoop.App -c Debug -p:Platform=x64

      - name: Keyboard tests
        run: dotnet test tests/Snoop.App.UITests -c Debug --logger "trx" --results-directory TestResults

      - name: Upload screenshots and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: |
            ui-test-screenshots
            TestResults
          if-no-files-found: ignore
